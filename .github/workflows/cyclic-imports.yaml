name: Cyclic Imports
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  cyclic-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@59716ab8fb83cc7025548b3831c06b6f5c268f4f # ratchet:durandtibo/setup-venv-uv-action@v0.1.0

      - name: check persista
        run: |
          python -c "import persista"

      - name: check persista.cache
        run: |
          python -c "from persista import cache"
          python -c "from persista.cache import factory"

      - name: check persista.http
        run: |
          python -c "from persista import http"
          python -c "from persista.http import httpx"
          python -c "from persista.http import requests"

      - name: check persista.store
        run: |
          python -c "from persista import store"
          python -c "from persista.store import factory"

      - name: check persista.utils
        run: |
          python -c "from persista import utils"
          python -c "from persista.utils import imports"
