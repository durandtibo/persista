# Comprehensive test suite workflow.
# Runs unit and integration tests across multiple Python versions and operating systems.
# Tests both with all dependencies and with minimal dependencies, and the
# Redis and Postgres stores against live servers.
# The ubuntu-latest/3.14 cell of the "all" matrix also uploads coverage to Codecov,
# so coverage tracking rides on an existing run instead of a separate full test pass.

name: Unit & Integration Tests
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  # Test with all dependencies across multiple Python versions and operating systems
  all:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10 # free-threaded and macOS cells are slow
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        # No free-threaded builds: psycopg-binary (psycopg extra) has no wheel
        # for them. The "min" job below covers them.
        python-version: ${{ fromJson(inputs.test-matrix).python_versions_standard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@6142e28631bebf642f8ff7087c8c8702f5d99c63 # ratchet:durandtibo/setup-venv-uv-action@v0.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: |
          inv test.unit --cov
      # Upload the coverage of the unit tests only (the integration tests below
      # replace coverage.xml) from a single representative cell of the matrix (only
      # for the main repository, to avoid spam from forks).
      - name: Upload coverage to Codecov
        if: |
          matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' &&
          github.repository == 'durandtibo/persista' && (github.event_name == 'push' || github.event_name == 'pull_request')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # ratchet:codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          # Ignore codecov failures as the codecov server is not
          # very reliable but we don't want to report a failure
          # in the github UI just because the coverage report failed to
          # be published.
          fail_ci_if_error: false
      - name: Run integration tests
        run: |
          inv test.integration --cov

  # Test with minimal dependencies to ensure optional dependencies are truly optional
  min:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10 # free-threaded and macOS cells are slow
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}
    steps:
      # Install only required dependencies, not optional ones
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@6142e28631bebf642f8ff7087c8c8702f5d99c63 # ratchet:durandtibo/setup-venv-uv-action@v0.3.2
        with:
          python-version: ${{ matrix.python-version }}
          install-args: "--no-optional-deps"
      - name: Run unit tests
        run: |
          inv test.unit
      - name: Run integration tests
        run: |
          inv test.integration

  # Test RedisStore against a live Redis server (service containers are only
  # supported on Linux-hosted runners, hence the separate job)
  redis:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        # No free-threaded builds: psycopg-binary (psycopg extra) has no wheel for them
        python-version: ${{ fromJson(inputs.test-matrix).python_versions_standard }}

    services:
      redis:
        image: index.docker.io/library/redis@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f # ratchet:redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@6142e28631bebf642f8ff7087c8c8702f5d99c63 # ratchet:durandtibo/setup-venv-uv-action@v0.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run RedisStore integration tests
        env:
          PERSISTA_TEST_REDIS_URL: redis://localhost:6379/0
        run: |
          inv test.integration

  # Test PostgresStore against a live Postgres server
  # (service containers are only supported on Linux-hosted runners, hence the
  # separate job)
  postgres:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        # No free-threaded builds: psycopg-binary (psycopg extra) has no wheel for them
        python-version: ${{ fromJson(inputs.test-matrix).python_versions_standard }}

    services:
      postgres:
        image: index.docker.io/library/postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea # ratchet:postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@6142e28631bebf642f8ff7087c8c8702f5d99c63 # ratchet:durandtibo/setup-venv-uv-action@v0.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run PostgresStore integration tests
        env:
          PERSISTA_TEST_POSTGRES_URL: postgresql://postgres@localhost:5432/postgres
        run: |
          inv test.integration
