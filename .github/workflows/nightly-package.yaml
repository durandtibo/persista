name: Nightly Package Tests
on:
  schedule:
    - cron: "30 10 * * *" # run at 10:30 AM UTC
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  get-versions:
    uses: ./.github/workflows/lib-get-package-versions.yaml

  # Load the shared python-version/OS matrix once, and pass it down to every
  # job below that needs it.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  stable:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install persista"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  stable-all:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: 'uv pip install "persista[all]"'
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  stable-extras:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package-extras.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install --pre persista"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest-all:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: 'uv pip install --pre "persista[all]"'
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest-extras:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package-extras.yaml
    with:
      install-args: "--pre"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  ########################
  #     Dependencies     #
  ########################

  coola:
    needs: [get-versions, get-matrix]
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: coola
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions).coola) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  #################################
  #     Optional dependencies     #
  #################################

  aiosqlite:
    needs: [get-versions, get-matrix]
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: aiosqlite
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions).aiosqlite) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  duckdb:
    needs: [get-versions, get-matrix]
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: duckdb
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions).duckdb) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  faker:
    needs: [get-versions, get-matrix]
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: faker
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions).faker) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  httpx:
    needs: [get-versions, get-matrix]
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: httpx
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions).httpx) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  lmdb:
    needs: [get-versions, get-matrix]
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: lmdb
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions).lmdb) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  #  polars:
  #    needs: [get-versions, get-matrix]
  #    uses: ./.github/workflows/nightly-test-package-dep.yaml
  #    with:
  #      package-name: polars
  #      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions).polars) }}
  #      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  psycopg:
    needs: [get-versions, get-matrix]
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: psycopg
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions).psycopg) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  redis:
    needs: [get-versions, get-matrix]
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: redis
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions).redis) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  requests:
    needs: [get-versions, get-matrix]
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: requests
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions).requests) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  rich:
    needs: [get-versions, get-matrix]
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: rich
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions).rich) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  urllib3:
    needs: [get-versions, get-matrix]
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: urllib3
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions).urllib3) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
