[build-system]
requires = ["hatchling>=1.33", "hatchling-autoextras-hook>=0.1.3"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests"]

[tool.hatch.metadata.hooks.autoextras]

[project]
name = "persista"
version = "0.0.4a3"
description = "Library for persisting and caching data"
readme = "README.md"
authors = [{ name = "Thibaut Durand", email = "durand.tibo+gh@gmail.com" }]
keywords = [
  "cache",
  "data",
  "persist",
  "store",
  "duckdb",
  "httpx",
  "lmdb",
  "postgres",
  "redis",
  "requests",
  "sqlite",
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]

dynamic = ["maintainers"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

requires-python = ">=3.11"
dependencies = ["coola >=1.2.0a1,<2.0"]

[project.optional-dependencies]
aiosqlite = ["aiosqlite >=0.20,<1.0"]
duckdb = ["duckdb>=1.3,<3.0"]
faker = ["faker >=40.0,<41.0"]
httpx = ["httpx >=0.28,<1.0"]
lmdb = ["lmdb >=2.0,<4.0"]
#polars = [ "polars>=1.30,<2.0" ]
psycopg = ["psycopg[binary] >=3.2,<4.0"]
redis = ["redis[hiredis]>=7.0,<9.0"]
requests = ["requests >=2.32,<3.0"]
rich = ["rich >=15.0,<16.0"]
urllib3 = ["urllib3 >=2.4,<3.0"]


[dependency-groups]

dev = [
  "codespell>=2.4,<3.0",
  "coverage[toml]>=7.17.4,<8.0",
  "docformatter>=1.7.8,<2.0",
  "feu[all]>=0.9.0,<1.0",
  # grimp (import-linter) does not build on free-threaded Python 3.13.
  "import-linter>=2.0,<3.0; python_version >= '3.14'",
  "invoke-tasklib>=0.1.0,<1.0",
  "invoke>=3.0,<4.0",
  "pre-commit>=4.7,<5.0",
  "pygments>=2.21,<3.0",
  "pyright>=1.1.414,<2.0",
  "pytest-benchmark>=5.1,<6.0",
  "pytest-cov>=7.1,<8.0",
  "pytest-timeout>=2.4,<3.0",
  "pytest>=9.2,<10.0",
  "ruff>=0.17,<1.0",
  "ty>=0.0.112,<1.0",
  "xdoctest>=1.3,<2.0",
  # Testing
  "anyio>=4.0,<5.0",
  "fakeredis>=2.36,<3.0",
  "testcontainers[postgres]>=4.15.0,<5.0",
]

docs = [
  "griffe-inherited-docstrings >=1.1,<2.0",
  "mike >=2.2,<3.0",
  "mkdocs-material >=9.7,<10.0",
  "mkdocstrings[python]>=1.0.8,<2.0",
  "mkdocs-include-markdown-plugin >=7.3,<8.0",
]

[project.urls]
Homepage = "https://github.com/durandtibo/persista"
Repository = "https://github.com/durandtibo/persista"
Documentation = "https://durandtibo.github.io/persista/"
Changelog = "https://github.com/durandtibo/persista/releases"
Issues = "https://github.com/durandtibo/persista/issues"

[tool.uv.pip]
torch-backend = "auto"

[tool.codespell]
skip = "*.lock,./.git,./htmlcov,./docs/site,coverage.xml"
ignore-words-list = "acount,intoto"

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["persista"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "^\\s*\\.\\.\\.$",
  "\\)( -> .+)?: \\.\\.\\.$",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests/"]
log_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
addopts = [
  "--color",
  "yes",
  "--durations",
  "10",
  "-rf",
  "--strict-markers",
  "--strict-config",
]
xfail_strict = true
timeout = 300
filterwarnings = ["error"]
anyio_mode = "auto"
# Configuration of the short test summary info
# https://docs.pytest.org/en/stable/usage.html#detailed-summary-report

[tool.docformatter]
recursive = true
wrap-summaries = 72
wrap-descriptions = 72
syntax = "google"

[tool.ruff]
# List of rules: https://docs.astral.sh/ruff/rules/
lint.select = [
  "A",    # builtins
  "ANN",  # annotations
  "ARG",  # flake8-unused-arguments
  "B",    # bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "C90",  # mccabe complexity
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle (Error)
  "EM",   # flake8-errmsg
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FA",   # flake8-future-annotations
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "INP",  # flake8-no-pep420
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # logging
  "N",    # naming
  "NPY",  # NumPy-specific rules
  "PD",   # pandas-vet
  "PERF", # Perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # Pylint
  "PT",   # flake8-pytest-style
  "PTH",  # pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific rules
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "T20",  # flake8-print
  "TC",   # flake8-type-checking
  "TD",   # flake8-todos
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle (Warning)
]
lint.ignore = [
  "A003",    # Class attribute `{name}` is shadowing a python builtin
  "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed.
  "E501",    # Line lengths are recommended to be no greater than 79 characters.
  "W505",    # Doc line too long
  "PLR0913", # Too many arguments in function definition (8 > 5)
  "PLR2004", # Magic value used in comparison, consider replacing 0.0 with a constant variable

  # The following rules are ignored because they conflict with another library like docformatter.
  "D102", # Missing docstring in public method
  "D105", # Missing docstring in magic method
  "D107", # Missing docstring in `__init__`
  "D205", # 1 blank line required between summary line and description
  "D209", # Multi-line docstring closing quotes should be on a separate line
]

# Enable on top of the Google convention.
lint.extend-select = ["D400", "D401", "D404"]

line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint.per-file-ignores]
# Ignore all directories named `tests`.
"tests/**" = [
  "D",    # pydocstyle
  "S101", # flake8-bandit: assert
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.isort]
force-sort-within-sections = false
combine-as-imports = true
known-first-party = ["persista"]

[tool.ruff.lint.flake8-import-conventions]
[tool.ruff.lint.flake8-import-conventions.aliases]
numpy = "np"
pandas = "pd"
polars = "pl"
pyarrow = "pa"
xarray = "xr"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.ty.src]
# tests is not type checked yet: many tests pass invalid values on purpose.
include = ["src", "dev"]

[tool.ty.environment]
python-version = "3.11"

[tool.importlinter]
root_package = "persista"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Utils must not import feature packages"
type = "forbidden"
source_modules = ["persista.utils"]
forbidden_modules = [
  "persista.store",
  "persista.cache",
  "persista.record",
  "persista.http",
  "persista.testing",
]

[[tool.importlinter.contracts]]
name = "Store must import utils only"
type = "forbidden"
source_modules = ["persista.store"]
forbidden_modules = ["persista.cache", "persista.record", "persista.http"]

[[tool.importlinter.contracts]]
name = "Cache must not import record or http"
type = "forbidden"
source_modules = ["persista.cache"]
forbidden_modules = ["persista.record", "persista.http"]

[[tool.importlinter.contracts]]
name = "Record must not import cache or http"
type = "forbidden"
source_modules = ["persista.record"]
forbidden_modules = ["persista.cache", "persista.http"]

[[tool.importlinter.contracts]]
name = "Library code must not import the testing helpers"
type = "forbidden"
source_modules = [
  "persista.utils",
  "persista.store",
  "persista.cache",
  "persista.record",
  "persista.http",
]
forbidden_modules = ["persista.testing"]
